<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Öğretmenim - Soru Çözüm Uygulaması</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['', ''], ['', '']], displayMath: [['\[', '\]'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-between antialiased">
    <header class="w-full max-w-md bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl"><i class="fa-solid fa-graduation-cap text-lg"></i></div>
            <div>
                <h1 class="text-base font-bold text-slate-800">AI Öğretmenim</h1>
                <p class="text-xs text-green-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block animate-pulse"></span> Çevrimiçi</p>
            </div>
        </div>
    </header>
    <main class="w-full max-w-md flex-1 p-6 flex flex-col justify-center items-center gap-6">
        <div id="displayCard" class="w-full bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col items-center justify-center min-h-[300px] relative overflow-hidden">
            <div id="placeholderText" class="text-center p-6">
                <i class="fa-solid fa-camera text-4xl text-slate-300 mb-3 block"></i>
                <p class="text-sm font-medium text-slate-500">Çözemediğin sorunun fotoğrafını çek veya galeriden yükle</p>
            </div>
            <img id="imagePreview" class="hidden w-full max-h-64 object-contain rounded-xl mb-4" src="" alt="Soru">
            <div id="loadingState" class="hidden text-center py-6">
                <div class="animate-spin text-indigo-600 text-3xl mb-3"><i class="fa-solid fa-circle-notch"></i></div>
                <p class="text-sm font-semibold text-slate-700">Öğretmeniniz inceliyor...</p>
            </div>
            <div id="solutionContainer" class="hidden w-full text-left mt-2 border-t border-slate-100 pt-4">
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 flex items-center justify-between mb-4">
                    <span class="text-xs font-bold text-indigo-800"><i class="fa-solid fa-volume-high mr-1"></i> SESLİ ANLATIM</span>
                    <audio id="audioPlayer" controls class="h-8 max-w-[200px]"></audio>
                </div>
                <div id="solutionText" class="text-sm text-slate-600 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200 overflow-x-auto"></div>
            </div>
        </div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
        <input type="file" id="galleryInput" accept="image/*" class="hidden">
    </main>
    <footer class="w-full max-w-md bg-white border-t border-slate-100 p-6 flex gap-4 sticky bottom-0 z-50">
        <button id="btnGallery" class="flex-1 bg-slate-100 text-slate-700 font-semibold py-4 px-4 rounded-2xl flex items-center justify-center gap-2 text-sm">Galeriden Seç</button>
        <button id="btnCamera" class="flex-2 bg-indigo-600 text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-2 text-sm">Fotoğraf Çek</button>
    </footer>
    <script>
        const btnCamera = document.getElementById('btnCamera'); const btnGallery = document.getElementById('btnGallery');
        const cameraInput = document.getElementById('cameraInput'); const galleryInput = document.getElementById('galleryInput');
        const imagePreview = document.getElementById('imagePreview'); const placeholderText = document.getElementById('placeholderText');
        const loadingState = document.getElementById('loadingState'); const solutionContainer = document.getElementById('solutionContainer');
        const solutionText = document.getElementById('solutionText'); const audioPlayer = document.getElementById('audioPlayer');
        btnCamera.addEventListener('click', () => cameraInput.click()); btnGallery.addEventListener('click', () => galleryInput.click());
        cameraInput.addEventListener('change', handleFile); galleryInput.addEventListener('change', handleFile);
        function handleFile(e) {
            const file = e.target.files; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                imagePreview.src = event.target.result; imagePreview.classList.remove('hidden'); placeholderText.classList.add('hidden'); solutionContainer.classList.add('hidden');
                uploadAndSolve(event.target.result.split(',')[1]);
            };
            reader.readAsDataURL(file);
        }
        async function uploadAndSolve(base64Image) {
            loadingState.classList.remove('hidden');
            try {
                const response = await fetch('/.netlify/functions/solve-question', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: base64Image })
                });
                const data = await response.json(); if (data.error) throw new Error(data.error);
                solutionText.innerHTML = data.solution; audioPlayer.src = `data:audio/mp3;base64,${data.audio}`;
                solutionContainer.classList.remove('hidden'); if (window.MathJax) { MathJax.typesetPromise([solutionText]); }
            } catch (error) { alert('Hata oluştu, lütfen tekrar deneyin.'); } finally { loadingState.classList.add('hidden'); }
        }
    </script>
</body>
</html>
